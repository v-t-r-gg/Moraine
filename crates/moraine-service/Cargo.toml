[package]
name = "moraine-service"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Local integration runtime for Moraine (minimal scaffold)"

[[bin]]
name = "moraine-service"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "signal", "fs", "io-util"] }
chrono = { workspace = true }
axum = { version = "0.8" }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { version = "1", features = ["v4", "serde"] }
moraine-core.workspace = true
moraine-platform.workspace = true
sha2 = { workspace = true }
hex = { workspace = true }
 
[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
