[package]
name = "moraine-provision"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Shared installation-state inspection and onboarding for Moraine CLI and desktop"

[dependencies]
moraine-core.workspace = true
moraine-platform.workspace = true
anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid = { workspace = true }
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
tempfile = "3"
moraine-service = { path = "../moraine-service" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
roxmltree = "0.20"
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
